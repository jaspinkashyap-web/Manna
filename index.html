    if (lightsOn) {
      c.save(); c.globalCompositeOperation = "screen";
      heads.forEach(([hx, hy, hw]) => {
        const beam = c.createLinearGradient(hx, hy, cx, y0 + (h - y0) * 0.2);
        beam.addColorStop(0, "rgba(235,242,255,.16)"); beam.addColorStop(1, "rgba(235,242,255,0)");
        c.fillStyle = beam; c.beginPath(); c.moveTo(hx - hw * 0.4, hy); c.lineTo(hx + hw * 0.4, hy);
        const tx = cx + (hx - cx) * 0.25, ty = y0 + (h - y0) * 0.22;
        c.lineTo(tx + w * 0.38, ty); c.lineTo(tx - w * 0.38, ty); c.closePath(); c.fill();
        let gl = c.createRadialGradient(hx, hy, 0, hx, hy, Math.max(60, hw * 9));
        gl.addColorStop(0, "rgba(255,252,240,.85)"); gl.addColorStop(0.12, "rgba(240,245,255,.35)"); gl.addColorStop(1, "rgba(200,215,255,0)");
        c.fillStyle = gl; c.fillRect(hx - hw * 9 - 60, hy - hw * 9 - 60, hw * 18 + 120, hw * 18 + 120);
      });
      const sky = c.createLinearGradient(0, y0 - 90, 0, y0 + 10);
      sky.addColorStop(0, "rgba(90,110,150,0)"); sky.addColorStop(1, "rgba(90,110,150,.22)");
      c.fillStyle = sky; c.fillRect(0, y0 - 90, w, 100);
      c.restore();
    }

    /* ---- morning mist ---- */
    if (tod === "morning") {
      const mw = Math.ceil(w / 2), top0 = y0 - 26, mh = Math.ceil(((h - y0) * 0.42 + 26) / 2);
      const mc = document.createElement("canvas"); mc.width = mw; mc.height = mh;
      const mx2 = mc.getContext("2d"), im = mx2.createImageData(mw, mh), D = im.data;
      for (let y = 0; y < mh; y++) {
        const yy = top0 + y * 2, rel = (yy - y0) / ((h - y0) * 0.42);
        const band = Math.exp(-Math.pow((rel - 0.08) / 0.32, 2));
        for (let x = 0; x < mw; x++) {
          const n = fbm(x * 0.012 + 11, y * 0.09, 4), a = sm(0.35, 0.75, n) * band * 0.55;
          const o = (y * mw + x) * 4, glow = Math.exp(-Math.pow((x * 2 - lx) / (w * 0.4), 2));
          D[o] = 255; D[o + 1] = 222 + glow * 10; D[o + 2] = 200 + glow * 5; D[o + 3] = a * 255;
        }
      }
      mx2.putImageData(im, 0, 0);
      c.globalAlpha = 1; c.drawImage(mc, 0, top0, w, mh * 2);
    }

    /* ---- grass blades, denser and taller toward the viewer ---- */
    const [h0, h1, s0, s1, l0, l1] = P.blade;
    for (let i = 0; i < 3600; i++) {
      const t = Math.pow(rnd(), 0.6), y = y0 + 6 + (h - y0 - 6) * t, near = (y - y0) / (h - y0);
      const len = 1 + 12 * near * near * (0.6 + rnd() * 0.7), x = rnd() * w, lean = (rnd() - 0.45) * len * 0.55;
      const lit = l0 + rnd() * (l1 - l0) + near * 4 + (tod === "morning" ? 6 * Math.exp(-Math.pow((x - lx) / (w * 0.3), 2)) : 0) + (lightsOn ? 10 * (1 - near * 0.45) : 0);
      c.globalAlpha = 0.35 + near * 0.45;
      c.strokeStyle = rnd() < P.tipRate ? P.tip : "hsl(" + (h0 + rnd() * (h1 - h0)) + "," + (s0 + rnd() * (s1 - s0)) + "%," + lit + "%)";
      c.lineWidth = 0.5 + near * 0.9;
      c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + lean * 0.3, y - len * 0.6, x + lean, y - len); c.stroke();
    }
    c.globalAlpha = 1;

    /* ---- seasons on the grass ---- */
    const dim = tod === "evening" ? (lightsOn ? 0.75 : 0.45) : 1;
    if (season === "fall") {
      const cols = ["#C8642A", "#B8402A", "#D9A23A", "#8A4A22", "#E0B04A"];
      for (let i = 0; i < 80; i++) {
        const t = Math.pow(rnd(), 0.7), y = y0 + 10 + (h - y0 - 10) * t, near = (y - y0) / (h - y0), s = 1.2 + near * 5.5;
        c.save(); c.translate(rnd() * w, y); c.rotate(rnd() * 6.28); c.scale(1, 0.45 + rnd() * 0.3);
        c.globalAlpha = (0.55 + rnd() * 0.35) * dim; c.fillStyle = cols[Math.floor(rnd() * cols.length)];
        c.beginPath(); c.ellipse(0, 0, s, s * 0.55, 0, 0, 6.283); c.fill(); c.restore();
      }
    }
    if (season === "spring") {
      for (let i = 0; i < 70; i++) {
        const t = Math.pow(rnd(), 0.5), y = y0 + 20 + (h - y0 - 20) * t, near = (y - y0) / (h - y0), x = rnd() * w, s = 0.6 + near * 1.6;
        c.globalAlpha = (0.6 + rnd() * 0.3) * dim; c.fillStyle = rnd() < 0.7 ? "#F4F2EA" : "#F2D45A";
        for (let j = 0; j < 3; j++) { c.beginPath(); c.arc(x + (rnd() - 0.5) * s * 3, y + (rnd() - 0.5) * s * 1.5, s, 0, 6.283); c.fill(); }
      }
    }
    if (season === "winter") {
      const frost = tod === "morning" ? 0.55 : tod === "evening" ? 0.35 : 0.1;
      c.globalAlpha = frost * 0.22; c.fillStyle = "#DCE8FF"; c.fillRect(0, y0, w, h - y0);
      c.fillStyle = "#F2F7FF";
      for (let i = 0; i < 3200; i++) {
        const t = Math.pow(rnd(), 0.6), y = y0 + 4 + (h - y0 - 4) * t, near = (y - y0) / (h - y0);
        c.globalAlpha = frost * (0.25 + rnd() * 0.5) * (0.4 + near * 0.6); c.fillRect(rnd() * w, y, 0.6 + near, 0.6 + near * 0.8);
      }
    }
    c.globalAlpha = 1;
    this.leaves = season === "fall" && !this.reduce ? Array.from({length: tod === "evening" ? 4 : 7}, () => {
      const near = 0.3 + rnd() * 0.65;
      return {x: rnd() * w, by: y0 + (h - y0) * near, vx: 14 + rnd() * 22, r: rnd() * 6.28, vr: (rnd() - 0.5) * 5, s: 2 + near * 5, ph: rnd() * 6.28,
        c: ["#C8642A", "#B8402A", "#D9A23A", "#E0B04A"][Math.floor(rnd() * 4)], a: (0.7 + rnd() * 0.25) * dim};
    }) : [];

    this.bg = cv;
    if (tod === "evening") {
      this.stars = Array.from({length: 42}, () => {
        const x = rnd() * w, y = 6 + Math.pow(rnd(), 1.5) * (y0 - 40);
        return {x, y, r: 0.6 + rnd() * 1.1, a: 0.45 + rnd() * 0.5, sp: 0.5 + rnd() * 1.4, ph: rnd() * 6.28, c: rnd() < 0.3 ? 1 : 0};
      }).filter(st => Math.hypot(st.x - mx, st.y - my) > mr * 4);
    }
    this.dew = Array.from({length: P.dew}, () => ({x: rnd() * w, y: y0 + (h - y0) * (0.25 + rnd() * 0.75), r: 0.5 + rnd() * 0.8, a: 0.5 + rnd() * 0.4, sp: 0.3 + rnd() * 0.8, ph: rnd() * 6.28}));
  },
  ph(x){
    const p = this.pile; if (p < 0.3) return 0;
    return Math.max(0, p * (0.7 + 0.3 * Math.sin(Math.PI * x / this.w)) + (p > 4 ? Math.sin(x * 0.045 + 1.3) * 1.5 + Math.sin(x * 0.013) * 2.2 : 0));
  },
  draw(t){
    const c = this.ctx; if (!c) return;
    const w = this.w, h = this.h;
    c.clearRect(0, 0, w, h);
    if (this.bg) {
      c.globalAlpha = 1;
      if (this.fadeFrom && this.running) {
        const k = Math.min(1, (t - this.fadeT0) / 1600);
        const flick = this.fadeOn && ((k > 0.08 && k < 0.13) || (k > 0.21 && k < 0.24)) ? 0.25 : 1;
        c.drawImage(this.fadeFrom, 0, 0, w, h);
        c.globalAlpha = Math.min(1, (this.fadeOn ? k * 1.25 : k)) * flick;
        c.drawImage(this.bg, 0, 0, w, h);
        c.globalAlpha = 1;
        if (k >= 1) this.fadeFrom = null;
      } else {
        this.fadeFrom = null;
        c.drawImage(this.bg, 0, 0, w, h);
      }
      const ts = t / 1000;
      if (this.tod === "evening") this.stars.forEach(s => {
        const tw = this.reduce ? 0.8 : 0.62 + 0.38 * Math.sin(ts * s.sp + s.ph) * Math.sin(ts * s.sp * 0.37 + s.ph * 2);
        const sz = s.r * 4.4; c.globalAlpha = s.a * tw;
        c.drawImage(this.sprites[s.c], s.x - sz / 2, s.y - sz / 2, sz, sz);
      });
      if (!this.reduce) this.dew.forEach(d => {
        const k = Math.sin(ts * d.sp + d.ph); if (k < 0.93) return;
        const a = Math.pow((k - 0.93) / 0.07, 2) * d.a, sz = d.r * 5;
        c.globalAlpha = a; c.drawImage(this.sprites[this.tod === "evening" ? 1 : 0], d.x - sz / 2, d.y - sz / 2, sz, sz);
      });
    }
    if (this.leaves && this.leaves.length) this.leaves.forEach(l => {
      c.save(); c.translate(l.x, l.by + Math.sin(t / 900 + l.ph) * 4); c.rotate(l.r); c.scale(1, 0.4 + 0.35 * Math.abs(Math.sin(l.r * 1.7)));
      c.globalAlpha = l.a; c.fillStyle = l.c; c.beginPath(); c.ellipse(0, 0, l.s, l.s * 0.55, 0, 0, 6.283); c.fill(); c.restore();
    });
    if (!this.reduce) {
      const cel = t < this.celebrateUntil;
      this.parts.forEach(p => {
        const sz = p.r * 5.5, spr = this.sprites[cel ? 2 : p.c];
        c.globalAlpha = Math.min(1, p.a * (cel ? 1.4 : 1));
        c.drawImage(spr, p.x - sz / 2, p.y - sz / 2, sz, sz);
      });
    }
    if (this.pile > 0.4) {
      c.globalAlpha = 1;
      const g = c.createLinearGradient(0, h - this.pile * 1.1, 0, h);
      g.addColorStop(0, "rgba(214,224,255,.30)"); g.addColorStop(0.45, "rgba(170,190,255,.16)"); g.addColorStop(1, "rgba(120,150,255,.05)");
      c.beginPath(); c.moveTo(0, h);
      for (let x = 0; x <= w; x += 8) c.lineTo(x, h - this.ph(x));
      c.lineTo(w, h); c.closePath(); c.fillStyle = g; c.fill();
      this.grains.forEach(gr => {
        const y = h - gr.d * this.ph(gr.x); if (h - y < 1.5) return;
        const sz = gr.r * 4.2; c.globalAlpha = gr.a; c.drawImage(this.sprites[gr.c], gr.x - sz / 2, y - sz / 2, sz, sz);
      });
    }
    c.globalAlpha = 1;
  },
  frame(t){
    if (!this.running) return;
    const dt = Math.min(0.05, (t - (this.last || t)) / 1000); this.last = t;
    this.pile += (this.pileTarget - this.pile) * Math.min(1, dt * 2.2);
    const cfg = this.cfg(), cel = t < this.celebrateUntil, cx = this.w / 2;
    this.parts.forEach(p => {
      if (cel) {
        p.y -= (55 + p.v * 70) * dt;
        p.x += (Math.sin(t / 420 + p.sway) * 60 + (cx - p.x) * 0.25) * dt;
      } else {
        p.y += p.v * cfg.v * dt;
        p.x += Math.sin(t / 1600 + p.sway) * p.amp * dt * 0.5;
        if (p.y < -30) p.y = -10 - Math.random() * this.h * 0.4;
        if (p.y > this.h - this.ph(p.x) - 1) this.spawn(p, false);
      }
      if (p.x < -10) p.x = this.w + 8; else if (p.x > this.w + 10) p.x = -8;

      l.x += l.vx * dt * (0.7 + 0.5 * Math.sin(t / 1300 + l.ph)); l.r += l.vr * dt;

    this.raf = requestAnimationFrame(tt => this.frame(tt));
  },
  loop(){
    const want = this.on && !document.hidden && this.ratio > 0 && !!this.ctx && !this.reduce;
    if (want && !this.running) { this.running = true; this.last = 0; this.raf = requestAnimationFrame(t => this.frame(t)); }
    else if (!want && this.running) { this.running = false; cancelAnimationFrame(this.raf); }
  },
  texts(){
    const p = S.profile || {}, first = String(p.name || "").trim().split(/\s+/)[0];
    const part = this.tod === "morning" ? "Morning" : this.tod === "afternoon" ? "Afternoon" : "Evening";
    $("#dawnGreet").textContent = part + (first ? ", " + first : "") + ".";
    const r = todayRec(), st = streak(), day = hitDay(r) ? st : st + 1;
    $("#dawnSub").textContent = "Day " + day + " of your streak";
    renderVerse();
    const vv = null, ve = null;
    if (ve) ve.innerHTML = S.verseOn === false ? "" : esc(vv[0]) + '<cite>' + esc(vv[1]) + '</cite>';
    $("#dawnAvatar").innerHTML = avatarHTML("");
    const f = latestFix();
    $("#dawnFocus").innerHTML = f && f.text ? '<div class="df-l">Today\'s focus</div><div class="df-t">' + esc(f.text) + '</div>'
      : (p.motto ? '<div class="df-t motto">' + esc(p.motto) + '</div>' : "");
    const today = dkey();
    const next = S.goals.filter(g => !g.achievedAt && g.date && g.date >= today).sort(byTarget)[0];
    if (next) {
      const n = daysBetween(today, next.date);
      $("#dawnGoal").innerHTML = ic("target") + '<b>' + esc(next.name) + '</b><span>' + (n === 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + " days") + '</span>';
    } else $("#dawnGoal").innerHTML = "";
    const post = phaseFrac("post");
    this.el.classList.toggle("unfinished", post < 1);
    $("#mbStreak").className = "mb-streak" + (st ? "" : " off");
    $("#mbStreak").innerHTML = ic("flame") + st;
  },
  count(to, dur){
    cancelAnimationFrame(this.numRaf);
    const el = $("#dawnPct"), from = this.shown, t0 = performance.now();
    if (this.reduce || dur <= 0 || from === to) { this.shown = to; el.innerHTML = to + "<span>%</span>"; return; }
    const step = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      const v = Math.round(from + (to - from) * e); el.innerHTML = v + "<span>%</span>";
      if (k < 1) this.numRaf = requestAnimationFrame(step); else this.shown = to;
    };
    this.numRaf = requestAnimationFrame(step);
  },
  apply(animate){
    const root = $("#dawnRings");
    RING.forEach(g => setRing(root, g.id, phaseFrac(g.id)));
    this.count(todayRec().pct, animate ? 700 : 0);
    this.pending = false;
    this.perfect();
  },
  perfect(){
    if (todayRec().pct < 100 || S.perfectDay === dkey()) return;
    if (this.ratio < 0.35 || !this.on) { this.pending = true; return; }
    S.perfectDay = dkey(); writeLocal();
    setTimeout(() => {
      if (this.reduce) return;
      const box = $("#dawnRings"); box.classList.remove("pulse"); void box.offsetWidth; box.classList.add("pulse");
      this.celebrateUntil = performance.now() + 2600;
    }, this.opened ? 250 : 1300);
  },
  sync(){
    if (!this.el) return;
    const r = todayRec(), hitNow = hitDay(r);
    if (this.lastHit === false && hitNow) Sound.play();
    this.lastHit = hitNow;
    if (this.bg && this.tod === "evening" && hitNow !== !!this.lit) {
      const old = this.bg; this.buildScene();
      if (this.running) { this.fadeFrom = old; this.fadeT0 = performance.now(); this.fadeOn = hitNow; }
      else this.draw(performance.now());
    }
    this.texts();
    const mini = $("#miniRings"); RING.forEach(g => setRing(mini, g.id, phaseFrac(g.id)));
    $("#mbPct").textContent = r.pct + "%";
    if (this.pileMax) { this.pileTarget = this.pileMax * r.pct / 100; if (!this.running) { this.pile = this.pileTarget; this.draw(performance.now()); } }
    if (!this.opened) return;
    if (this.ratio >= 0.35 && this.on) this.apply(true); else this.pending = true;
  },
  open(){
    this.opened = true;
    const root = $("#dawnRings"), box = root;
    if (this.reduce) {
      box.classList.add("pre"); RING.forEach(g => setRing(root, g.id, phaseFrac(g.id)));
      this.count(todayRec().pct, 0);
      requestAnimationFrame(() => requestAnimationFrame(() => box.classList.remove("pre")));
      this.perfect(); return;
    }
    const cs = RING.map(g => root.querySelector('[data-ring="' + g.id + '"]'));
    cs.forEach((c, i) => { c.style.transition = "none"; c.style.strokeDashoffset = circ(RING[i].r).toFixed(2); });
    void root.offsetWidth;
    RING.forEach((g, i) => setTimeout(() => {
      cs[i].style.transition = "stroke-dashoffset .8s cubic-bezier(.33,0,.2,1), opacity .2s ease";
      setRing(root, g.id, phaseFrac(g.id));
    }, 80 + i * 200));
    setTimeout(() => cs.forEach(c => c.style.transition = ""), 1400);
    this.shown = 0; this.count(todayRec().pct, 1200);
    this.perfect();
  },
  show(on){
    if (!this.el) return;
    const was = this.on; this.on = on;
    this.el.style.display = on ? "" : "none";
    if (!on) $("#minibar").classList.remove("show");
    if (on) {
      if (!was) this.resize();
      this.sync();
      if (!this.opened) this.open();
      this.onScroll();
    }
    this.loop();
  },
  onScroll(){
    if (!this.on) return;
    const y = Math.max(0, window.scrollY), H = this.el.offsetHeight || 1, p = Math.min(1, y / H);
    if (!this.reduce) this.inner.style.transform = "translate3d(0," + (y * 0.45).toFixed(1) + "px,0) scale(" + (1 - 0.16 * p).toFixed(3) + ")";
    this.inner.style.opacity = Math.max(0, 1 - p * 1.35).toFixed(3);
    $("#dawnBg").style.opacity = Math.max(0, 1 - p * 1.1).toFixed(3);
    $("#minibar").classList.toggle("show", p > 0.62);
  },
  headOffset(){ return ($("#minibar").offsetHeight || 56) + 10; },
  scrollToEl(el){
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - this.headOffset();
    window.scrollTo({top: Math.max(0, top), behavior: this.reduce ? "auto" : "smooth"});
  },
  toChecklist(){ this.scrollToEl($(".checklist")); },
  toPhase(id){
    const sec = $("#phase-" + id); if (!sec) return;
    if (S.collapsed[id]) { S.collapsed[id] = false; sec.classList.remove("closed"); const b = sec.querySelector(".phase-head"); if (b) b.setAttribute("aria-expanded", "true"); writeLocal(); }
    this.scrollToEl(sec);
  }
};

/* ---------- Day rollover ---------- */
let curDay = dkey();
function checkDay(){
  if (dkey() !== curDay) { curDay = dkey(); UI.openHist = null; recompute(); processDays(); evalRewards(); UI.dirty = true; render(true); }
}
setInterval(() => { checkDay(); Dawn.tick(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDay(); });
window.addEventListener("focus", checkDay);

/* ---------- Boot ---------- */
S = load();
recompute();
processDays();
evalRewards();
Dawn.init();
window.addEventListener("resize", () => { if ($("#pack").classList.contains("show")) Pack.resize(); });
render();
maybeSetup();
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
