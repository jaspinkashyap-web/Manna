<!DOCTYPE html>
<!--
=========================================================================
  MANNA v1.0  -  a soccer habit tracker that installs on your phone
=========================================================================
  HOW THE CARD SYSTEM IS ORGANIZED (plain English)

  1. THE TIER LIST  ->  search this file for "CARD TIER CONFIG".
     It sits at the very top of the app's code. Every card tier is one
     line-group there: its name, the OVR it needs, how many days of
     tracking it needs, its colors, and which effects it uses. The
     special editions (Kintsugi, Volcanic, Storm Surge) are right below
     it in SPECIAL_CARDS.

  2. THE CARD LOOK  ->  search for "CARD LIBRARY".
     This turns a tier's settings into a card. It holds the card
     outlines (CARD_SHAPES), base surfaces (MATERIALS), edge decorations
     (ORNAMENTS), and moving effects like sparks and snow (CARD_FX).
     You normally never need to touch it.

  3. THE PACK OPENING  ->  search for "PACK OPENING".
     The 7-step reveal animation and the reveal sounds live there.

  4. UNLOCK RULES  ->  search for "UNLOCKING".
     When tiers and special editions unlock.

  HOW TO ADD A NEW TIER
     a. Find "CARD TIER CONFIG".
     b. Copy an existing tier's block (from { to },) and paste it where
        it belongs in the order. The list must stay lowest to highest.
     c. Give it a new id (letters only) and a name.
     d. Set ovr (the OVR needed) and days (days of tracking needed).
     e. Pick a shape, material, border, and idle from the names already
        used in the list, or from the lists in the CARD LIBRARY.
     f. Change the colors. Each is a hex code like "#FF1493".
     g. List its effects. Copy one from another tier to start.
     h. Save the file. The binder and preview mode pick it up on their own.

  PREVIEW MODE: in Settings, tap "Manna v1.0" five times.

  CHANGELOG
  v1.0  Standalone release for GitHub Pages
        - Installs to the home screen, runs full screen, works offline
          (manifest.webmanifest, sw.js, icons folder)
        - Saves only in this browser (localStorage); Claude account sync removed
        - Export my data / Import data in Settings
        - 28 card tiers unlocked by OVR, plus 3 special editions
        - New 7-step pack opening, collection binder, hidden preview mode
        - Card opening sound toggle (off by default)
  Earlier  Player card, Plan tab, rest days, streak freezes, seasons,
           stadium lights, daily and weekly verses
=========================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manna">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Manna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;--card:#1C1C1E;--raised:#2C2C2E;--raised2:#3A3A3C;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#FFFFFF;--text2:#D1D1D6;--text3:#9C9CA3;
  --blue:#2952E3;--blue-text:#7390FF;--blue-soft:rgba(41,82,227,.14);
  --pink:#FF1493;--violet:#8A4DEB;--pink-soft:rgba(255,20,147,.12);
  --danger:#FF5A52;
  --tab-h:58px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--blue-text);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:520px;margin:0 auto;padding:8px 20px calc(var(--tab-h) + 48px + env(safe-area-inset-bottom,0px))}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Headers */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 0 0}
.large{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0}
.sub{color:var(--text3);font-size:15px;font-weight:500;margin:6px 0 0}
.h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.round-btn{width:36px;height:36px;border-radius:50%;background:var(--raised);color:var(--blue-text);display:grid;place-items:center;transition:background .15s,transform .12s}
.round-btn:active{transform:scale(.92);background:var(--raised2)}
.round-btn .ic{width:20px;height:20px;stroke-width:2.2}

/* Score */
.score{background:#000;border:1px solid var(--line2);border-radius:22px;padding:22px 20px 20px;margin-top:24px}
.score-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pct{font-size:68px;font-weight:800;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
.pct span{font-size:30px;letter-spacing:-.02em;color:var(--text3);margin-left:3px;font-weight:700}
.pct-label{color:var(--text3);font-size:14px;margin-top:10px;font-weight:500}
.marks{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:14px;font-weight:600;color:#fff}
.marks-track{flex:1;min-width:60px;height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.marks-track i{display:block;height:100%;width:0;background:var(--pink);border-radius:4px;transition:width .4s var(--ease)}
.marks span{font-variant-numeric:tabular-nums}
.streak{text-align:right;padding-bottom:2px}
.streak-num{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;font-size:28px;font-weight:750;letter-spacing:-.03em;line-height:1;color:#fff;background:var(--raised);padding:9px 14px 9px 11px;border-radius:16px;transition:background .25s;font-variant-numeric:tabular-nums;transition:color .25s}
.streak-num .ic{width:24px;height:24px;stroke-width:2}
.streak.live .streak-num{background:var(--pink)}
.streak-label{font-size:13px;color:var(--text3);margin-top:8px;font-weight:500}
.segs{display:flex;gap:6px;margin-top:22px}
.seg{min-width:0}
.seg-track{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.seg-fill{height:100%;width:0;background:var(--sc,var(--blue));border-radius:3px;transition:width .4s var(--ease)}
.seg-name{font-size:12px;color:var(--text3);margin-top:8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Banner */
.banner{display:flex;align-items:center;gap:12px;background:var(--pink-soft);border:1px solid rgba(255,20,147,.38);border-radius:18px;padding:12px 8px 12px 16px;margin-top:18px;animation:drop .4s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.banner-main{flex:1;display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.banner .ic{color:var(--pink);width:22px;height:22px}
.banner-t{font-size:13px;color:var(--pink);font-weight:650}
.banner-n{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner-x{width:40px;height:40px;display:grid;place-items:center;color:var(--text3)}

/* Goals */
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px 8px;margin-top:14px}
.box-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.goal{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line);min-height:62px}
.goal:first-of-type{border-top:0}
.goal-tile{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--pink-soft);color:var(--pink)}
.goal-left{display:flex;align-items:center;gap:12px;min-width:0}
.goal-name{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.goal-date{font-size:13px;color:var(--text3);margin-top:3px;font-weight:500}
.count{text-align:right;flex:none}
.count-n{color:var(--pink);font-size:22px;font-weight:750;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.count-l{font-size:12px;color:var(--text3);margin-top:4px;font-weight:500}
.count.soon .count-l{color:var(--pink)}
.count.past .count-n{color:var(--text3)}
.link-btn{color:var(--blue-text);font-size:15px;font-weight:600;padding:12px 0;display:flex;align-items:center;gap:6px}
.link-btn .ic{width:16px;height:16px;transition:transform .25s var(--ease)}
.link-btn[aria-expanded="true"] .ic{transform:rotate(180deg)}
.foot-row{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:2px}
.achieved-item{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.achieved-item .when{color:var(--pink);font-size:13px;font-weight:600;flex:none}
.empty{color:var(--text3);font-size:15px;margin:6px 0 14px;line-height:1.45}

/* Fix card */
.fix{display:flex;gap:14px;align-items:flex-start;background:rgba(41,82,227,.24);border:1px solid rgba(115,144,255,.55);border-radius:20px;padding:16px 18px;margin-top:24px}
.fix .ic{color:var(--blue-text);margin-top:2px}
.fix-l{font-size:13px;color:var(--blue-text);font-weight:650}
.fix-t{font-size:17px;font-weight:650;letter-spacing:-.015em;margin-top:2px;line-height:1.35;word-break:break-word}
.fix-d{font-size:13px;color:var(--text3);margin-top:6px}

/* Phases */
.checklist{margin-top:24px}
.phase{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-top:12px;overflow:hidden}
.phase-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;min-height:64px}
.phase-left{display:flex;align-items:center;gap:12px}
.phase-tile{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--raised);background:color-mix(in srgb,var(--pc) 22%,transparent);color:var(--pc)}
.phase{border-top:3px solid var(--pc)!important}
.phase-title{font-size:18px;font-weight:700;letter-spacing:-.02em}
.phase-meta{display:flex;align-items:center;gap:10px;color:var(--text3);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.phase-meta.full{color:var(--pc)}
.phase-meta .ic{transition:transform .28s var(--ease);color:var(--text3)}
.phase.closed .phase-meta .ic{transform:rotate(-90deg)}
.phase-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s var(--ease)}
.phase.closed .phase-body{grid-template-rows:0fr}
.phase-inner{overflow:hidden;min-height:0}
.habit{width:100%;display:flex;align-items:center;gap:14px;padding:13px 20px;min-height:58px;border-top:1px solid var(--line)}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #4A4A4E;display:grid;place-items:center;transition:background .2s ease,border-color .2s ease,transform .15s ease}
.check svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .24s ease .06s}
.habit.done .check{background:var(--pc);border-color:var(--pc)}
.habit{transition:background .25s}
.habit.done{background:color-mix(in srgb,var(--pc) 9%,transparent)}
.habit.done .check svg{stroke-dashoffset:0}
.habit:active .check{transform:scale(.88)}
.habit-name{font-size:16px;font-weight:500;line-height:1.35;transition:color .2s}
.habit.done .habit-name{color:var(--text3)}
.bonus{--pc:var(--pink)}
.bonus-bar{height:6px;border-radius:3px;background:var(--raised);margin:0 20px 16px;overflow:hidden}
.bonus-bar i{display:block;height:100%;width:0;background:var(--pink);border-radius:3px;transition:width .4s var(--ease)}
.pts{margin-left:auto;font-size:14px;font-weight:700;color:var(--pink);font-variant-numeric:tabular-nums;flex:none}
.habit.done .pts{color:var(--text3)}
.bonus .phase-meta.full{color:var(--pink)}
.pts-btn{height:34px;min-width:44px;padding:0 10px;border-radius:17px;background:var(--pink-soft);color:var(--pink);font-weight:700;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper span{min-width:34px;text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.phase-empty{padding:4px 20px 18px;color:var(--text3);font-size:15px}
.phase-foot{padding:14px 20px 18px;border-top:1px solid var(--line)}
.saved-note{text-align:center;color:var(--text3);font-size:13px;margin-top:10px}

/* Buttons */
.btn{width:100%;min-height:52px;border-radius:14px;font-weight:650;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:disabled{background:var(--raised);color:var(--text3);cursor:default;transform:none}
.btn-secondary{background:var(--raised);color:var(--text)}
.btn-pink{background:var(--pink);color:#fff}
.btn-text{min-height:48px;color:var(--blue-text)}
.btn-text.danger{color:var(--danger)}
.btn + .btn{margin-top:10px}
.small-btn{height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:650;background:var(--raised);color:var(--text);flex:none;transition:transform .12s}
.small-btn:active{transform:scale(.95)}
.small-btn.pink{background:var(--pink);color:#fff}
.small-btn.blue{background:var(--blue);color:#fff}

/* History */
.export{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-top:24px;text-align:left}
.export .ic{color:#fff;width:22px;height:22px;background:var(--blue);border-radius:11px;padding:8px;box-sizing:content-box}
.export-t{font-size:16px;font-weight:650}
.export-s{font-size:13px;color:var(--text3);margin-top:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-top:14px;overflow:hidden}
.hrow{width:100%;display:flex;align-items:center;gap:14px;padding:14px 18px;min-height:64px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow-main{flex:1;min-width:0}
.hrow-d{font-size:16px;font-weight:600}
.hrow-s{font-size:13px;color:var(--text3);margin-top:2px;display:flex;gap:8px;align-items:center}
.tag{font-size:12px;font-weight:650;color:var(--pink);background:var(--pink-soft);padding:2px 8px;border-radius:8px}
.hrow-p{text-align:right;width:64px;flex:none}
.hrow-pct{font-size:20px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hrow-pct.hit{color:var(--blue-text)}
.mini{height:4px;border-radius:2px;background:var(--raised);margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--blue);border-radius:2px}
.detail{padding:0 18px 16px;animation:fade .2s ease}
.detail-block{padding:12px 0;border-top:1px solid var(--line)}
.detail-h{font-size:13px;color:var(--text3);font-weight:650;margin-bottom:4px}
.detail-p{font-size:15px;color:var(--text2);line-height:1.45;margin:0;word-break:break-word}

/* Rewards */
.section-h{font-size:15px;font-weight:650;color:var(--text3);margin:28px 4px 10px}
.reward{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 16px 18px;margin-top:10px;cursor:pointer}
.reward.ready{border-color:rgba(255,20,147,.45)}
.reward-ic{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;color:var(--blue-text);flex:none}
.reward.ready{background:rgba(255,20,147,.1)}
.reward.ready .reward-ic{background:var(--pink);color:#fff}
.reward-main{flex:1;min-width:0}
.reward-n{font-size:16px;font-weight:650;line-height:1.3;word-break:break-word}
.reward-c{font-size:13px;color:var(--text3);margin-top:3px;font-weight:500}
.reward.ready .reward-c{color:var(--pink)}
.reward .mini{max-width:160px}
.reward .mini i{background:var(--pink)}
.claimed-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.claimed-item:first-child{border-top:0}
.claimed-item span:last-child{color:var(--text3);font-size:13px;flex:none}
.big-empty{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin-top:24px}
.big-empty p{margin:0;color:var(--text2);font-size:16px;line-height:1.5}
.big-empty .btn{margin-top:18px}

/* Settings */
.set-card{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-top:14px;padding:6px 0 0}
.set-title{font-size:18px;font-weight:700;letter-spacing:-.02em;padding:12px 18px 8px}
.set-row{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 18px;border-top:1px solid var(--line);min-height:56px}
.set-input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:16px;padding:10px 0;border-radius:8px}
.set-input:focus{color:#fff}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;color:var(--text3);border-radius:10px;flex:none;transition:background .15s,color .15s}
.icon-btn:active{background:var(--raised)}
.icon-btn:disabled{opacity:.25}
.icon-btn.danger{color:var(--danger)}
.add-row{display:flex;gap:8px;padding:12px 12px 14px 18px;border-top:1px solid var(--line)}
.add-row .txt{flex:1;min-height:44px;padding:10px 12px}
.add-row .small-btn{height:44px;border-radius:12px}
.note-card{color:var(--text3);font-size:14px;line-height:1.5;padding:20px 4px 0}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(22,22,24,.84);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:1px solid var(--line);z-index:20}
.tabs{max-width:520px;margin:0 auto;display:flex;height:var(--tab-h)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8E8E93;font-size:10.5px;font-weight:600;letter-spacing:.01em;transition:color .15s}
.tab .ic{width:25px;height:25px;stroke-width:1.7}
.tab.on{color:var(--blue-text)}
.tab .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--pink);transform:translate(12px,-10px)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .34s var(--ease);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.show{transform:none}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--raised2);margin:0 auto 14px}
.sheet-title{font-size:24px;font-weight:750;letter-spacing:-.025em;margin:4px 0 18px}
.fl{display:block;font-size:14px;font-weight:600;color:var(--text2);margin-bottom:16px}
.fl .optional{color:var(--text3);font-weight:500}
.fl .txt{margin-top:8px}
.txt{display:block;width:100%;background:var(--raised);border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.4;resize:none;outline:none;min-height:48px;-webkit-appearance:none;appearance:none;transition:border-color .15s}
.txt:focus{border-color:var(--blue)}
.txt.bad{border-color:var(--danger);animation:shake .3s ease}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
input[type="date"].txt{text-align:left;min-height:48px}
input[type="date"].txt::-webkit-date-and-time-value{text-align:left}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;border-radius:12px;background:var(--raised);font-size:16px;font-weight:500;border:1px solid transparent;transition:background .15s,border-color .15s;text-align:left}
.choice.on{border-color:var(--blue);background:var(--blue-soft)}
.choice .radio{width:20px;height:20px;border-radius:50%;border:2px solid #5A5A5E;flex:none;display:grid;place-items:center}
.choice.on .radio{border-color:var(--blue)}
.choice.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}
.choice small{color:var(--text3);font-size:13px;margin-left:auto}
.sheet-actions{margin-top:22px}
.err{color:var(--danger);font-size:13px;margin-top:6px;font-weight:500}

/* Segmented + ratings */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{min-height:50px;border-radius:12px;background:var(--raised);font-weight:650;font-size:16px;border:1px solid transparent;transition:background .15s,color .15s,transform .1s;text-align:center;font-variant-numeric:tabular-nums}
.opt:active{transform:scale(.95)}
.opt.on{background:var(--blue);color:#fff}
.opts.cond{grid-template-columns:repeat(3,1fr);margin-top:8px}

/* Reflection full screen */
.full{position:fixed;inset:0;z-index:50;background:#000;transform:translateY(100%);transition:transform .38s var(--ease);display:flex;flex-direction:column;visibility:hidden}
.full.show{transform:none;visibility:visible}
.full-head{flex:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;border-bottom:1px solid var(--line);background:#000}
.full-head-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:44px}
.full-head .btn-text{width:auto;padding:0 12px;min-height:44px;font-weight:500}
.full-title{font-size:17px;font-weight:650}
.full-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.full-in{max-width:520px;margin:0 auto;padding:6px 20px calc(36px + env(safe-area-inset-bottom,0px))}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.q-h{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 14px}
.q-h::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc,var(--blue))}
.q{border-top:3px solid var(--pc,var(--blue))!important}
.q .opt.on{background:var(--pc,var(--blue))}
.q-l{font-size:15px;font-weight:600;color:var(--text2);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.q-l small{color:var(--text3);font-weight:500;font-size:13px}
.q-gap{height:18px}
.remain{text-align:center;color:var(--text3);font-size:14px;margin-top:10px;min-height:21px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translate(-50%,16px);opacity:0;background:#2C2C2E;border:1px solid var(--line2);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:600;z-index:70;display:flex;gap:16px;align-items:center;transition:opacity .22s ease,transform .22s var(--ease);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--blue-text);font-weight:650}

/* Profile */
.avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:700;font-size:17px;letter-spacing:-.01em;border:2px solid var(--pink)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.xl{width:116px;height:116px;font-size:40px;border-width:3px}
.avatar.empty{background:var(--raised);color:var(--text3);border:2px dashed var(--raised2)}
.avatar.empty .ic{width:34px;height:34px}
.avatar-btn{align-self:center;border-radius:50%;transition:transform .12s}
.avatar-btn:active{transform:scale(.94)}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--blue-text);font-size:17px;font-weight:500;min-height:44px;margin:6px 0 0 -8px;padding:0 8px}
.back .ic{width:22px;height:22px;stroke-width:2.2}
.prof{text-align:center;margin-top:8px}
.prof .avatar{margin:0 auto}
.prof-name{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:8px 0 0}
.prof-motto{color:var(--text2);font-size:16px;margin:8px auto 0;max-width:32ch;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.chip{background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;color:var(--text2)}
.chip.num{background:var(--pink);border-color:var(--pink);color:#fff}
.prof .btn{margin-top:20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.stat-n{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.stat-l{font-size:13px;color:var(--text3);margin-top:8px;font-weight:500}
.stat.hot{background:var(--pink);border-color:var(--pink)}
.stat.hot .stat-l{color:rgba(255,255,255,.85)}
.stat.blue{background:var(--blue);border-color:var(--blue)}
.stat.blue .stat-l{color:rgba(255,255,255,.85)}
.photo-pick{display:block;margin:26px auto 0;border-radius:50%}
.photo-link{display:block;margin:10px auto 0;color:var(--blue-text);font-size:15px;font-weight:600;min-height:40px;padding:0 12px}
.pos-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pos-chips button{height:36px;padding:0 13px;border-radius:18px;background:var(--raised);font-size:14px;font-weight:600;color:var(--text2);transition:background .15s}
.pos-chips button.on{background:var(--blue);color:#fff}
#setup{z-index:55}
.setup-in{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 36px) 22px calc(36px + env(safe-area-inset-bottom,0px))}
.data-btns{padding:4px 18px 18px}
.reward-days{font-size:12px;font-weight:700;color:var(--blue-text);font-variant-numeric:tabular-nums}
.reward.ready .reward-days{color:#fff}
.reward-n.slot{color:var(--blue-text)}
/* Dawn */
.dawn{position:relative;height:90vh;height:90svh;min-height:540px;overflow:hidden;background:#000;isolation:isolate;touch-action:pan-y}
.dawn canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dawn-glow{position:absolute;left:-25%;right:-25%;bottom:-38%;height:75%;background:radial-gradient(closest-side,rgba(255,168,96,.26),rgba(255,120,90,.09) 55%,rgba(255,120,90,0) 78%);opacity:0;transition:opacity 2s ease;z-index:0;pointer-events:none}
.dawn-bg{position:absolute;inset:0;z-index:0;pointer-events:none;will-change:opacity}
.dawn-scrim{position:absolute;inset:0;pointer-events:none;transition:opacity 1.5s ease;
  background:radial-gradient(circle at 50% 47%,rgba(0,0,0,.42) 0,rgba(0,0,0,.24) 24%,rgba(0,0,0,0) 44%),
  linear-gradient(to bottom,rgba(0,0,0,.42) 0,rgba(0,0,0,0) 27%,rgba(0,0,0,0) 68%,rgba(0,0,0,.3) 86%,#000 100%)}
.dawn.morning .dawn-scrim{opacity:.85}.dawn.afternoon .dawn-scrim{opacity:1}.dawn.evening .dawn-scrim{opacity:.55}
.greet,.greet-sub,.dawn-focus,.dawn-goal,.gather,.rings-center{text-shadow:0 1px 14px rgba(0,0,0,.55)}
@keyframes rise{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-5%);opacity:1}}
.dawn-inner{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;padding:20px 22px 0;display:flex;flex-direction:column;will-change:transform,opacity;transform-origin:50% 42%}
.dawn-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.greet{font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 0;word-break:break-word}
.greet-sub{color:var(--text3);font-size:15px;font-weight:500;margin-top:8px}
.dawn-verse{margin-top:12px;max-width:34ch;font-size:14.5px;line-height:1.45;color:var(--text2);font-style:italic;text-shadow:0 1px 14px rgba(0,0,0,.6);animation:fade 1.4s ease;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.dawn-verse cite{font-style:normal;font-size:12px;color:var(--text3);font-weight:600;margin-left:6px;white-space:nowrap}
.sw{width:51px;height:31px;border-radius:16px;background:var(--raised2);position:relative;flex:none;transition:background .2s ease}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .22s var(--ease)}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(20px)}
.dawn-verse{cursor:pointer}
.dawn-verse .vref{font-style:normal;font-size:12px;color:var(--text3);font-weight:600;margin-left:6px;white-space:nowrap}
.dawn-verse.mine{color:#fff;font-size:15.5px;-webkit-line-clamp:7}
.aff-l{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--pink);margin-bottom:4px;letter-spacing:.01em}
.aff-add{display:block;font-style:normal;font-size:13px;font-weight:650;color:var(--blue-text);margin-top:6px}
.aff-add.sun{color:var(--pink)}
.aff-past{width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);font-size:15px;color:var(--text2);line-height:1.4}
.aff-past small{display:block;color:var(--text3);font-size:12px;margin-top:4px}
.rings-wrap{flex:1;display:grid;place-items:center;min-height:0;padding:10px 0}
.rings-box{position:relative;width:min(74vw,300px,40vh);aspect-ratio:1/1;transition:opacity .6s ease}
.rings-box.pre{opacity:0}
.rings-box::before{content:"";position:absolute;inset:-12%;border-radius:50%;z-index:-1;pointer-events:none;transition:opacity 1.5s ease;
  background:radial-gradient(closest-side,rgba(0,0,0,.66) 0,rgba(0,0,0,.55) 66%,rgba(0,0,0,.22) 86%,rgba(0,0,0,0) 100%)}
.dawn.evening .rings-box::before{opacity:.45}
.rings{width:100%;height:100%;display:block;overflow:visible}
.rings circle,.mini-rings circle{fill:none;stroke-linecap:round}
.rf{transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1),opacity .25s ease}
.rf.zero{opacity:0}
.rhit{stroke:transparent!important;stroke-width:26px!important;pointer-events:stroke;cursor:pointer;outline:none}
.rhit:focus-visible{stroke:rgba(255,255,255,.12)!important}
.rings-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.rc-n{font-size:clamp(40px,12vw,58px);font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.rc-n span{font-size:.44em;color:var(--text2);margin-left:2px;font-weight:700;letter-spacing:-.02em}
.rc-l{font-size:12px;color:var(--text3);margin-top:6px;font-weight:600}
.dawn.evening.unfinished .rg-post{animation:ringglow 4.5s ease-in-out infinite}
@keyframes ringglow{0%,100%{filter:drop-shadow(0 0 1px rgba(255,255,255,.25))}50%{filter:drop-shadow(0 0 8px rgba(255,255,255,.8))}}
.rings-box.pulse{animation:pulse 1.3s cubic-bezier(.4,0,.2,1)}
@keyframes pulse{0%{transform:scale(1);filter:brightness(1)}38%{transform:scale(1.05);filter:brightness(1.35)}100%{transform:scale(1);filter:brightness(1)}}
.dawn-focus{text-align:center;min-height:44px}
.df-l{font-size:13px;font-weight:650;color:var(--pink)}
.df-t{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.df-t.motto{color:var(--text2);font-weight:500;font-style:italic}
.dawn-goal{display:flex;justify-content:center;align-items:center;gap:7px;color:var(--text3);font-size:14px;font-weight:500;margin-top:10px;min-height:20px}
.dawn-goal .ic{width:16px;height:16px;color:var(--blue-text)}
.dawn-goal b{color:var(--text2);font-weight:600;max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gather{display:flex;flex-direction:column;align-items:center;gap:0;margin:14px auto 20px;color:var(--text2);font-size:13px;font-weight:600;min-height:48px;padding:6px 18px;animation:float 3.4s ease-in-out infinite;opacity:.8}
.gather .ic{width:20px;height:20px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.minibar{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:rgba(0,0,0,.74);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);transform:translateY(-100%);opacity:0;transition:transform .38s var(--ease),opacity .3s ease;pointer-events:none}
.minibar.show{transform:none;opacity:1;pointer-events:auto}
.minibar-in{max-width:520px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;width:100%}
.mini-rings{width:34px;height:34px;display:block;flex:none}
.mb-pct{font-size:20px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mb-l{font-size:13px;color:var(--text3);font-weight:500}
.mb-streak{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--pink);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.mb-streak .ic{width:18px;height:18px;stroke-width:2}
.mb-streak.off{color:var(--text3)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  .minibar,.dawn-inner,.rings-box,.dawn-bg{transition:opacity .4s ease!important}
  .gather{animation:none!important}}

/* Plan / sessions */
.sheet{z-index:61}.backdrop{z-index:60}
#sess{z-index:52}
.se-hero{position:relative;display:block;width:100%;overflow:hidden;border-radius:26px;padding:22px 22px 20px;text-align:left;isolation:isolate;
  background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 42%,#000) 0%,#07091A 58%,#000 100%);border:1px solid color-mix(in srgb,var(--tc) 50%,transparent);transition:transform .15s}
.se-hero:active{transform:scale(.985)}
.se-hero-glow{position:absolute;right:-30%;top:-45%;width:85%;aspect-ratio:1;border-radius:50%;z-index:-1;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--tc) 55%,transparent),transparent);opacity:.7}
.se-hero-top{display:flex;justify-content:space-between;align-items:center}
.se-type{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#fff;background:color-mix(in srgb,var(--tc) 32%,transparent);padding:6px 12px 6px 10px;border-radius:999px}
.se-type .ic{width:16px;height:16px;stroke-width:2}
.se-next{font-size:13px;font-weight:700;color:var(--tc)}
.se-hero-title{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:18px;word-break:break-word}
.se-hero-meta{display:flex;align-items:center;gap:7px;color:var(--text2);font-size:15px;font-weight:550;margin-top:8px}
.se-hero-meta .ic{width:17px;height:17px;color:var(--tc)}
.se-hero-goals{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);display:grid;gap:8px}
.se-hg{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:550;line-height:1.35}
.se-hg .ic{width:17px;height:17px;color:var(--tc);margin-top:1px}
.se-more{font-size:13px;color:var(--text3);font-weight:600;padding-left:27px}
.se-hero-open{margin-top:18px;display:inline-flex;height:40px;align-items:center;padding:0 18px;border-radius:20px;background:#fff;color:#000;font-size:15px;font-weight:700}
.se-card{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 16px 12px 12px;margin-top:10px;text-align:left;transition:transform .12s;position:relative;overflow:hidden}
.se-card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--tc)}
.se-card:active{transform:scale(.985)}
.se-date{width:52px;height:56px;border-radius:14px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tc) 16%,transparent);margin-left:4px}
.se-date span{font-size:11px;font-weight:700;color:var(--tc);line-height:1}
.se-date b{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:3px;font-variant-numeric:tabular-nums}
.se-main{flex:1;min-width:0}
.se-title{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.se-sub{display:flex;align-items:center;gap:10px;margin-top:5px;font-size:13px;color:var(--text3);font-weight:550}
.se-chip{display:inline-flex;align-items:center;gap:5px;color:var(--tc);font-weight:650}
.se-chip .ic{width:14px;height:14px;stroke-width:2}
.se-right{flex:none;text-align:right}
.se-gc{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--text3);font-weight:600}
.se-gc b{font-size:18px;color:#fff;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
.se-check{width:30px;height:30px;border-radius:50%;background:var(--tc);display:grid;place-items:center}
.se-check .ic{width:16px;height:16px;stroke:#fff;stroke-width:3}
.se-card.done{opacity:.72}
.se-card.done .se-title{text-decoration:line-through;text-decoration-color:var(--text3)}
.se-toggle{margin-top:18px}
.se-types{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.se-tbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 12px;border-radius:20px;background:var(--raised);font-size:14px;font-weight:650;color:var(--text2);border:1px solid transparent;transition:background .15s}
.se-tbtn .ic{width:17px;height:17px;color:var(--tc)}
.se-tbtn.on{background:color-mix(in srgb,var(--tc) 22%,transparent);border-color:var(--tc);color:#fff}
.se-dt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.se-plan-in{font-size:15px;min-height:180px}
.sd-hero{margin-top:16px;border-radius:24px;padding:20px;background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 40%,#000),#000 75%);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent)}
.sd-title{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:16px 0 0;word-break:break-word}
.sd-done{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:14px;font-weight:700;color:#fff;background:var(--tc);padding:6px 12px;border-radius:999px}
.sd-done .ic{width:15px;height:15px;stroke-width:3}
.sd-count{margin-left:auto;font-size:14px;color:var(--text3);font-weight:600}
.sd-goal{width:100%;display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:16px;font-weight:500;line-height:1.4;text-align:left}
.sd-goal:first-of-type{border-top:0;padding-top:2px}
.sd-goal .check{margin-top:-2px}
.sd-goal.on .check{background:var(--pc);border-color:var(--pc)}
.sd-goal.on .check svg{stroke-dashoffset:0}
.sd-goal.on span:last-child{color:var(--text3)}
.sd-plan{font-size:15px;line-height:1.55;color:var(--text2);word-break:break-word}
.sd-plan h4{font-size:16px;font-weight:750;color:#fff;margin:18px 0 6px;letter-spacing:-.01em}
.sd-plan h4:first-child{margin-top:0}
.sd-plan p{margin:0 0 8px}
.sd-plan ul,.sd-plan ol{margin:0 0 10px;padding-left:22px}
.sd-plan li{margin:3px 0}
.sd-plan li::marker{color:var(--pc)}
.sd-plan b{color:#fff;font-weight:650}

/* Category checkboxes + sleep */
.habit.cat:not(.done) .check{border-color:color-mix(in srgb,var(--pc) 70%,#3A3A3C)}
.sl-badge{margin-left:auto;flex:none;min-width:48px;height:30px;padding:0 10px;border-radius:15px;display:grid;place-items:center;font-size:14px;font-weight:750;font-variant-numeric:tabular-nums;color:#fff;background:color-mix(in srgb,var(--pc) 28%,transparent)}
.habit.done .sl-badge{background:var(--pc);color:#fff}
.sl-in{font-size:34px!important;font-weight:800;letter-spacing:-.03em;min-height:68px!important;text-align:center}
.sl-avg{font-size:14px;color:var(--text3);margin:-4px 0 6px}
.sl-avg b{color:#fff;font-size:16px}

/* Categories */

/* ===================== Tier cards ===================== */
.tc{position:relative;width:100%;aspect-ratio:5/7.2;container-type:inline-size;transform:perspective(900px) rotateY(calc(var(--tx,0) * 7deg)) rotateX(calc(var(--ty,0) * -6deg));transition:transform .25s ease-out;--beat:0}

.tc-top{display:grid;grid-template-columns:24cqw 1fr;gap:2cqw;flex:1;min-height:0}
.tc-id{display:flex;flex-direction:column;align-items:center;gap:1.6cqw;padding-top:1cqw}

.tc-pos{font-size:6.4cqw;font-weight:750;letter-spacing:.02em}
.tc-flag{font-size:10cqw;line-height:1;margin-top:1cqw;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}

.tc-photo{display:grid;place-items:center;min-height:0}
.tc-photo img{width:100%;max-width:68cqw;aspect-ratio:1;object-fit:cover;border-radius:9cqw;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 98%);mask-image:linear-gradient(180deg,#000 62%,transparent 98%)}
.tc-mono{font-size:42cqw;font-weight:900;letter-spacing:-.06em;line-height:1;background:linear-gradient(180deg,var(--ink),transparent);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.8;text-shadow:none}
.tc-name{text-align:center;font-size:9.6cqw;font-weight:850;letter-spacing:-.02em;padding:1cqw 0 3cqw;margin-bottom:3.6cqw;border-bottom:.4cqw solid color-mix(in srgb,var(--ink) 25%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.idle-heartbeat .tc-glow{opacity:calc(.25 + var(--beat) * .7)}
.ov-holo{background:linear-gradient(calc(120deg + var(--tx,0) * 40deg),rgba(255,0,128,.35),rgba(255,200,0,.3),rgba(0,255,160,.3),rgba(0,160,255,.35),rgba(200,0,255,.3),rgba(255,0,128,.35));background-size:200% 200%;background-position:calc(50% + var(--tx,0) * 50%) calc(50% + var(--ty,0) * 50%);mix-blend-mode:hard-light;opacity:.38}
.idle-razor .tc-sweep{background:linear-gradient(118deg,transparent 47%,rgba(255,255,255,.9) 48.4%,transparent 49%,transparent 70%,rgba(190,200,255,.7) 70.6%,transparent 71.2%);background-size:220% 100%;opacity:.8;animation-duration:3.8s}
.idle-smolder .smolderedge{animation:smolder 1.8s ease-in-out infinite}

.ov-frost{background-size:100% 100%;-webkit-mask-image:radial-gradient(75% 65% at 50% 45%,transparent 40%,#000 90%);mask-image:radial-gradient(75% 65% at 50% 45%,transparent 40%,#000 90%);opacity:.85}
.idle-frost .ov-frost{animation:frost 12s ease-in-out infinite alternate}
@keyframes frost{from{-webkit-mask-size:100% 100%;mask-size:100% 100%}to{-webkit-mask-size:62% 62%;mask-size:62% 62%}}
.idle-frost .ov-frost{-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.ov-fire{background:conic-gradient(from calc(var(--tx,0) * 200deg) at 50% 42%,rgba(255,80,80,.55),rgba(255,220,60,.5),rgba(80,255,140,.5),rgba(60,180,255,.55),rgba(200,80,255,.5),rgba(255,80,80,.55));mix-blend-mode:color-dodge;opacity:.45}

.ov-core{background:radial-gradient(30% 22% at 62% 30%,#fff,transparent 70%);mix-blend-mode:screen}

/* ===================== Pack opening ===================== */
.pack{position:fixed;inset:0;z-index:90;background:#050507;display:none;overflow:hidden;touch-action:manipulation;transition:background .4s ease}
.pack.show{display:block}.pack.dark{background:#000}
.pack canvas{position:absolute;inset:0;width:100%;height:100%}
.pack.quake .pk-stage{animation:quake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes quake{10%,90%{transform:translate(calc(var(--q) * -.3),calc(var(--q) * .15))}20%,80%{transform:translate(calc(var(--q) * .6),calc(var(--q) * -.3))}30%,50%,70%{transform:translate(calc(var(--q) * -1),calc(var(--q) * .4))}40%,60%{transform:translate(var(--q),calc(var(--q) * -.4))}}
.pack.slowmo .pk-stage{transition:transform 1.1s ease-in;transform:scale(1.08)}
.pk-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1300px;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}

.po-sub{font-size:12px;color:rgba(255,255,255,.6);font-weight:600}
.po-cracks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.po-cracks path{stroke-dasharray:400;stroke-dashoffset:400;filter:drop-shadow(0 0 4px var(--flare))}
.po-pack.cracking .po-cracks path{animation:crack .5s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.po-pack.shake{animation:poShake var(--dur) linear}
@keyframes poShake{0%,100%{transform:none}10%,50%,90%{transform:translate(calc(var(--amp) * -1),calc(var(--amp) * .4)) rotate(-1.5deg)}30%,70%{transform:translate(var(--amp),calc(var(--amp) * -.4)) rotate(1.5deg)}}
.po-pack.cracking{animation:none;box-shadow:0 0 60px var(--flare)}

  ["goals","rewards","banners","sessions"].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });

  if (!out.v || out.v < 2) {
    const kept = (Array.isArray(d.rewards) ? d.rewards : []).filter(r => r && r.type === "streak" && r.streak > 0)
      .map(r => ({id: r.id || uid(), days: r.streak, name: r.name || "", earnedAt: r.claimedAt || r.unlockedAt || null}));
    presetRewards().forEach(pr => { if (!kept.some(k => k.days === pr.days)) kept.push(pr); });

const FXLOW = matchMedia("(pointer: coarse)").matches ? 0.6 : 1;
const FXCALM = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function drawShape(c, shape, x, y, s, col, a, rot){
  c.globalAlpha = a; c.fillStyle = col; c.strokeStyle = col;
  if (shape === "dot" || shape === "speck" || shape === "snow") { if (shape !== "dot") { c.globalAlpha = a * .3; c.beginPath(); c.arc(x, y, s * 2.6, 0, 6.283); c.fill(); c.globalAlpha = a; } c.beginPath(); c.arc(x, y, s, 0, 6.283); c.fill(); }
  else if (shape === "dust") c.fillRect(x, y, s, s);
  else if (shape === "spark") { c.globalAlpha = a * .35; c.beginPath(); c.arc(x, y, s * 3, 0, 6.283); c.fill(); c.globalAlpha = a; c.fillStyle = "#FFF6DC"; c.beginPath(); c.arc(x, y, s * .8, 0, 6.283); c.fill(); }
  else if (shape === "pearl") { const g = c.createRadialGradient(x - s * .35, y - s * .35, 0, x, y, s); g.addColorStop(0, "#FFFFFF"); g.addColorStop(.6, "#F4E8F2"); g.addColorStop(1, "#C6B6D8"); c.fillStyle = g; c.beginPath(); c.arc(x, y, s, 0, 6.283); c.fill(); }

/* Runs every visible card's effects on one shared animation loop */
const CardFX = {
  items: new Map(), raf: 0, io: null,
  mount(root){
    if (!this.io && "IntersectionObserver" in window) this.io = new IntersectionObserver(es => es.forEach(e => { const it = this.items.get(e.target); if (it) it.vis = e.isIntersecting; }), {rootMargin: "80px"});
    (root || document).querySelectorAll(".tc[data-tier]").forEach(el => {
      if (this.items.has(el)) return;
      const t = tierById(el.dataset.tier), cv = el.querySelector(".tc-fx");
      const it = {el, t, cv, c: cv.getContext("2d"), st: t.effects.map(() => ({el})), vis: !this.io, last: performance.now()};
      this.items.set(el, it); if (this.io) this.io.observe(el);
      const touch = e => { const r = el.getBoundingClientRect(), pt = e.touches ? e.touches[0] : e; if (!pt) return; const x = pt.clientX - r.left, y = pt.clientY - r.top;
        it.st.forEach(s => { s.touch = {x, y, t: performance.now()}; });
        el.style.setProperty("--tx", ((x / r.width) * 2 - 1).toFixed(3)); el.style.setProperty("--ty", ((y / r.height) * 2 - 1).toFixed(3)); el.classList.add("tilting"); };
      el.addEventListener("pointermove", touch); el.addEventListener("pointerdown", touch);
      el.addEventListener("pointerleave", () => el.classList.remove("tilting"));
      if (FXCALM()) setTimeout(() => this.frame(it, 1200), 30);
    });
    if (!this.raf && !FXCALM()) this.raf = requestAnimationFrame(t => this.tick(t));
  },
  frame(it, t){
    const r = it.cv.getBoundingClientRect(); if (!r.width) return;
    const d = Math.min(FXLOW < 1 ? 1.5 : 2, devicePixelRatio || 1), W = Math.round(r.width * d), H = Math.round(r.height * d);
    if (it.cv.width !== W || it.cv.height !== H) { it.cv.width = W; it.cv.height = H; it.st.forEach(s => { delete s.p; delete s.paths; delete s.cl; }); }
    const c = it.c, dt = Math.min(.05, (t - it.last) / 1000); it.last = t;
    c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, r.width, r.height); c.globalCompositeOperation = it.t.lightBase ? "source-over" : "lighter";
    if (!it.el.classList.contains("tilting") && !FXCALM()) { it.el.style.setProperty("--tx", (Math.sin(t / 3100) * .6).toFixed(3)); it.el.style.setProperty("--ty", (Math.cos(t / 3700) * .4).toFixed(3)); }
    it.t.effects.forEach((o, i) => { try { CARD_FX[o.fx](o, it.st[i], c, r.width, r.height, t, dt); } catch (e) {} });
    c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
  },
  tick(t){
    this.items.forEach((it, el) => { if (!el.isConnected) { this.items.delete(el); if (this.io) this.io.unobserve(el); return; } if (it.vis) this.frame(it, t); });
    this.raf = this.items.size ? requestAnimationFrame(tt => this.tick(tt)) : 0;
  }
};

/* =====================================================================
   UNLOCKING: tiers unlock by OVR (plus days tracked); special editions
   unlock from streak events. Unlocks are permanent.
   ===================================================================== */
const trackedDays = () => Object.keys(S.days).filter(k => (S.days[k].total || 0) + (S.days[k].marks || 0) > 0).length;
function currentRun(){
  const today = dkey(); let k = hitDay(S.days[today]) ? today : addDays(today, -1);
  if (!hitDay(S.days[k]) && !S.frozen[k]) return null;
  let start = k, len = 0, g = 0;
  while ((hitDay(S.days[k]) || S.frozen[k]) && g++ < 4000) { if (hitDay(S.days[k])) { len++; start = k; } k = addDays(k, -1); }
  return len ? {start, len, before: k} : null;
}
function bestBefore(end){
  const keys = Object.keys(S.days).filter(k => k < end).sort(); if (!keys.length) return 0;
  let k = keys[0], run = 0, best = 0, g = 0;
  while (k < end && g++ < 4000) { if (hitDay(S.days[k])) { run++; best = Math.max(best, run); } else if (!S.frozen[k]) run = 0; k = addDays(k, 1); }
  return best;
}
const perfectDay = r => r && (r.total || 0) > 0 && (r.done || 0) >= r.total;
function unlockCard(t, again){
  const C = S.cards;
  if (!C.unlocked[t.id]) { C.unlocked[t.id] = dkey(); S.notices.push({id: uid(), kind: "card", ed: t.id, date: dkey(), text: t.id === "wood" ? "Your first card is ready. Tap to open it." : "You unlocked the " + t.name + " card. Tap to open it."}); }
  else if (again) S.notices.push({id: uid(), kind: "card", ed: t.id, date: dkey(), text: "You earned " + t.name + " again. That's " + C.count[t.id] + " times."});
}
function checkCards(){
  const C = S.cards, r = cardRatings(), td = trackedDays();
  Object.keys(C.unlocked).forEach(id => { if (!ALL_CARDS().some(t => t.id === id)) { delete C.unlocked[id]; delete C.opened[id]; } });
  if (r.ovr !== null) C.bestOvr = Math.max(C.bestOvr || 0, r.ovr);
  CARD_TIERS.forEach(t => { if (!C.unlocked[t.id] && (t.ovr === 0 || (r.ovr !== null && r.ovr >= t.ovr && td >= t.days))) unlockCard(t); });
  const earn = id => { C.count[id] = (C.count[id] || 0) + 1; unlockCard(SPECIAL_CARDS.find(x => x.id === id), true); };
  const run = currentRun();
  /* Kintsugi: a new streak reaches 7 days after an earlier streak (3+ days) broke */
  if (run && run.len >= 7 && C.kint !== run.before && streakEndingAt(addDays(run.before, -1)) >= 3) { C.kint = run.before; earn("kintsugi"); }
  /* Volcanic: every task finished on 7 days in a row */
  const today = dkey(), end = perfectDay(S.days[today]) ? today : addDays(today, -1);
  let perfect = true; for (let i = 0; i < 7; i++) if (!perfectDay(S.days[addDays(end, -i)])) { perfect = false; break; }
  if (perfect && (!C.volc || daysBetween(C.volc, end) >= 7)) { C.volc = end; earn("volcanic"); }
  /* Storm Surge: this streak passes your previous best (5+ days) */
  if (run && C.storm !== run.start) { const pb = bestBefore(run.start); if (pb >= 5 && run.len > pb) { C.storm = run.start; earn("stormsurge"); } }
  if (!C.equipped || !C.opened[C.equipped]) C.equipped = ALL_CARDS().filter(t => C.opened[t.id]).map(t => t.id).pop() || "wood";
}
function nextTier(){ const C = S.cards; return CARD_TIERS.find(t => !C.unlocked[t.id]) || null; }

function readCrest(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("read"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("decode"));
      img.onload = () => {
        const s = Math.min(1, 160 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/png"));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* =====================================================================

   1 pack pulses, tap shakes it (harder for rarer)  2 fade to black
   3 flare in the tier's color  4 pack cracks with the material's effect

   7 NEW TIER UNLOCKED banner. Rare tiers add a walkout, slow motion,
   screen shake, a longer burst, and a final glow pulse.
   ===================================================================== */
const Pack = {
  tok: 0, parts: [], rings: [], flashA: 0, raf: 0, speed: 1, bgA: 0,
  rnd: (a, b) => a + Math.random() * (b - a),

  open(id, mode){

    this.el.className = "pack show"; this.el.style.setProperty("--flare", t.colors.flare); document.body.style.overflow = "hidden";

      '<span class="po-lbl">MANNA</span><span class="po-sub">' + (this.mode === "preview" ? "Preview" : isSpecial(t) ? "Special edition" : "Player card") + '</span></div><svg class="po-cracks" viewBox="0 0 100 144" aria-hidden="true"></svg></div><p class="po-tap">Tap to open</p></div>';
    this.waiting = true;
    if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(tt => this.loop(tt)); }

  resize(){ const d = Math.min(2, devicePixelRatio || 1); this.W = innerWidth; this.H = innerHeight; this.cv.width = this.W * d; this.cv.height = this.H * d; this.c.setTransform(d, 0, 0, d, 0, 0); this.cx = this.W / 2; this.cy = this.H * .42; },
  tap(){ if (!this.waiting) return; this.waiting = false; this.run(this.tok); },
  async run(tok){
    const t = this.t, r = this.r, fam = t.family, pk = $("#poPack"), ok = () => tok === this.tok;

    pk.style.setProperty("--amp", (2 + r * 12).toFixed(1) + "px"); pk.style.setProperty("--dur", (.5 + r * .9).toFixed(2) + "s"); pk.classList.add("shake");

  async walkout(tok){

/* ---------- Tabs ---------- */
function renderTabs(){

  const ready = S.banners.length > 0;
  const cur = UI.tab === "profile" || UI.tab === "collection" ? "today" : UI.tab;
  $("#tabs").innerHTML = tabs.map(([id, label, icon]) =>
    '<button class="tab' + (cur === id ? " on" : "") + '" data-action="tab" data-v="' + id + '" aria-current="' + (UI.tab === id ? "page" : "false") + '" style="position:relative">' +
    ic(icon) + (id === "rewards" && ready ? '<span class="dot" aria-hidden="true"></span>' : "") + '<span>' + label + '</span></button>'
  ).join("");
}

    '<div class="banner card"><button class="banner-main" data-action="goCards">' + ic("unlock") + '<span style="min-width:0"><div class="banner-t">New card</div><div class="banner-n" style="white-space:normal">' + esc(n.text) + '</div></span></button>' +

    '<button class="banner-x" data-action="dismissNotice" data-id="' + n.id + '" aria-label="Dismiss">' + ic("x") + '</button></div>').join("");

function tasksText(r){

  return m >= g ? m + " tasks done, streak day locked in" : m + " of " + g + (r.rest ? " rest-day tasks" : " tasks today");
}
function segData(){
  const r = todayRec(), done = new Set(r.checked), bd = new Set(r.bonus || []);
  return PHASES.map(p => { const l = todayHabits(p.id); return {id: p.id, name: p.short, n: l.length, d: l.filter(h => done.has(h.id)).length, color: p.color}; })

}
function scoreHTML(){

    '<div class="seg" style="flex:' + Math.max(g.n, 1) + ' 1 0;--sc:' + g.color + '"><div class="seg-track"><div class="seg-fill" id="seg-' + g.id + '" style="width:' + (g.n ? Math.round(g.d / g.n * 100) : 0) + '%"></div></div><div class="seg-name">' + g.name + '</div></div>'

function countdown(g){
  if (!g.date) return "";
  const n = daysBetween(dkey(), g.date);
  if (n === 0) return '<div class="count soon"><div class="count-n">Today</div><div class="count-l">target</div></div>';
  if (n < 0) return '<div class="count past"><div class="count-n">' + (-n) + '</div><div class="count-l">' + (n === -1 ? "day past" : "days past") + '</div></div>';
  return '<div class="count' + (n <= 7 ? " soon" : "") + '"><div class="count-n">' + n + '</div><div class="count-l">' + (n === 1 ? "day" : "days") + '</div></div>';
}
function goalsHTML(){
  const active = S.goals.filter(g => !g.achievedAt).sort(byTarget);
  const done = S.goals.filter(g => g.achievedAt).sort((a, b) => b.achievedAt.localeCompare(a.achievedAt));
  const shown = UI.allGoals ? active : active.slice(0, 3);
  let h = '<section class="box" id="goals"><div class="box-head"><h2 class="h3">Goals</h2>' +
    '<button class="round-btn" data-action="newGoal" aria-label="Add goal">' + ic("plus") + '</button></div>';
  if (!active.length) h += '<p class="empty">' + (done.length ? "Nothing active right now. Add the next one." : "Add something you're chasing, like a first hat trick or a trial date. Give it a date and it counts down here.") + '</p>';
  h += shown.map(g => '<button class="goal" data-action="goal" data-id="' + g.id + '"><div class="goal-left"><span class="goal-tile">' + ic("target") + '</span><div style="min-width:0"><div class="goal-name">' + esc(g.name) + '</div>' +

  if (more || hasDone) {
    h += '<div class="foot-row">' +
      (more ? '<button class="link-btn" data-action="toggleAllGoals">' + (UI.allGoals ? "Show fewer" : "Show all " + active.length) + '</button>' : "<span></span>") +
      (hasDone ? '<button class="link-btn" data-action="toggleAchieved" aria-expanded="' + UI.showAchieved + '">Achieved ' + done.length + ic("chev") + '</button>' : "") + '</div>';
    if (hasDone && UI.showAchieved) {
      h += '<div style="padding-bottom:6px">' + done.map(g => '<button class="achieved-item" data-action="goal" data-id="' + g.id + '"><span>' + esc(g.name) + '</span><span class="when">Achieved ' + fmtShort(g.achievedAt) + '</span></button>').join("") + '</div>';

function phaseHTML(p){

  const closed = !!S.collapsed[p.id];
  let rows = list.map(h => {
    const on = r.checked.includes(h.id);
    const c = catOf(h.cat), sc = h.kind === "sleep" && r.sleepScore != null ? r.sleepScore : null;
    return '<button class="habit' + (on ? " done" : "") + (c ? " cat" : "") + '"' + (c ? ' style="--pc:' + c.color + '"' : "") + ' data-action="toggle" data-id="' + h.id + '" aria-pressed="' + on + '">' +

  }).join("");
  if (!list.length) rows = '<div class="phase-empty">' + (isRest() ? "Nothing here on rest days." : "No habits here yet. Add them in Settings.") + '</div>';

async function copyText(t){
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand("copy"); ta.remove(); if (ok) return true;
  } catch (e) {}
  return false;
}

function readPhoto(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("read"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("decode"));
      img.onload = () => {
        const side = Math.min(img.naturalWidth, img.naturalHeight), out = Math.min(320, side);
        const c = document.createElement("canvas"); c.width = c.height = out;
        const cx = c.getContext("2d");
        cx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, out, out);
        res(c.toDataURL("image/jpeg", 0.8));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function backup(){
  const data = JSON.stringify({app: "manna", version: 3, exportedAt: new Date().toISOString(), data: S});
  const filename = "manna-backup-" + dkey() + ".json", blob = new Blob([data], {type: "application/json"});
  try {
    const file = new File([blob], filename, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]}) && /iPhone|iPad|iPod/.test(navigator.userAgent)) { await navigator.share({files: [file], title: "Manna backup"}); toast("Backup ready"); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("Backup downloaded");
  } catch (e) { toast("Your browser blocked the download"); }
}

  h += '<section class="set-card"><div class="set-title">Your data</div><p class="note-card" style="padding:0 18px 14px">' +
    'Everything saves in this browser on this device. Export a backup now and then, and use it to move Manna to a new phone.</p>' +

    '<div class="about"><button data-action="versionTap" aria-label="Version">Manna v1.0</button></div></div>';
  return h;
}

/* ---------- Render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  const m = $("#main");
  if (UI.tab === "today") m.innerHTML = renderToday();
  else if (UI.tab === "history") m.innerHTML = renderHistory();
  else if (UI.tab === "plan") m.innerHTML = renderPlan();
  else if (UI.tab === "rewards") m.innerHTML = renderRewards();
  else if (UI.tab === "profile") m.innerHTML = renderProfile();
  else if (UI.tab === "collection") m.innerHTML = renderCollection();
  else m.innerHTML = renderSettings();
  CardFX.mount(m);
  if (keepScroll) { window.scrollTo(0, y); const v = m.querySelector(".view"); if (v) v.style.animation = "none"; }
  renderTabs();
  Dawn.show(UI.tab === "today");
  save();
}
function rerenderGoals(){

/* ---------- Toast ---------- */
let toastT;
function toast(msg, action){
  const t = $("#toast");
  t.innerHTML = "<span>" + esc(msg) + "</span>" + (action ? '<button data-action="undo">Undo</button>' : "");
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove("show"); UI.undo = null; }, action ? 4000 : 1800);
}

/* ---------- Actions ---------- */
function addHabit(phase){
  const inp = $("#add-" + phase); if (!inp) return;
  const name = inp.value.trim();
  if (!name) { inp.classList.add("bad"); setTimeout(() => inp.classList.remove("bad"), 400); inp.focus(); return; }
  const cat = (UI.addCat || {})[phase] || "", base = {id: uid(), name, added: dkey()};
  if (cat) base.cat = cat;
  if ((UI.addRest || {})[phase]) { base.rest = true; UI.addRest[phase] = false; }
  listFor(phase).push(phase === "bonus" ? Object.assign(base, {pts: 1}) : base);
  if (UI.addCat) UI.addCat[phase] = "";
  recompute(); render(true);
  const n = $("#add-" + phase); if (n) n.focus();
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const a = el.dataset.action, id = el.dataset.id;
  UI.dirty = true;

  switch (a) {
    case "tab":
      UI.tab = el.dataset.v;
      if (UI.tab === "rewards") S.banners = [];
      window.scrollTo(0, 0); render(); break;

    case "toggle": {
      const hb = PHASES.flatMap(p => S.habits[p.id]).find(h => h.id === id);
      if (hb && hb.kind === "sleep") { sleepSheet(id); break; }
      const r = todayRec(), i = r.checked.indexOf(id), wasHit = hitDay(r);
      if (i >= 0) r.checked.splice(i, 1); else r.checked.push(id);
      recompute();
      const fresh = evalRewards();
      save();
      el.classList.toggle("done", i < 0);
      el.setAttribute("aria-pressed", String(i < 0));
      patchScore();
      if (!wasHit && hitDay(r)) toast(UI.earned ? "Streak day locked in. Freeze earned." : "Streak day locked in");
      if (fresh || wasHit !== hitDay(r)) { $("#banners").innerHTML = bannersInner(); renderTabs(); }
      break;
    }
    case "btoggle": {
      const r = todayRec(); r.bonus = r.bonus || [];
      const i = r.bonus.indexOf(id), wasHit = hitDay(r);
      if (i >= 0) r.bonus.splice(i, 1); else r.bonus.push(id);
      recompute();
      const fresh = evalRewards(); save();
      el.classList.toggle("done", i < 0); el.setAttribute("aria-pressed", String(i < 0));
      patchBonus(); patchScore();
      if (!wasHit && hitDay(r)) toast(UI.earned ? "Streak day locked in. Freeze earned." : "Streak day locked in");
      if (fresh || wasHit !== hitDay(r)) { $("#banners").innerHTML = bannersInner(); renderTabs(); }
      break;
    }
    case "phase": {
      S.collapsed[id] = !S.collapsed[id]; save();
      const sec = $("#phase-" + id);
      sec.classList.toggle("closed", S.collapsed[id]);
      el.setAttribute("aria-expanded", String(!S.collapsed[id]));
      break;
    }
    case "editAffirm": affirmSheet(); break;
    case "reuseAffirm": { const p = S.affirm[el.dataset.v]; if (p) affirmSheet({text: p.text, ref: p.ref}); break; }
    case "saveAffirm": {
      const text = $("#affText").value.trim(), ref = $("#affRef").value.trim();
      if (!text) { $("#affErr").textContent = "Type your verse first."; return; }
      S.affirm[weekKey()] = {text, ref, set: dkey()};
      closeSheet(); save(); renderVerse(); toast("Verse set for the week"); break;
    }
    case "clearAffirm":
      delete S.affirm[weekKey()]; closeSheet(); save(); renderVerse(); toast("Verse removed"); break;
    case "setting": {
      const k = el.dataset.k; S[k] = S[k] === false;
      el.classList.toggle("on", S[k] !== false); save(); Dawn.texts();
      if (k === "soundOn" && S[k]) { const was = Dawn.lastHit; Sound.play(); Dawn.lastHit = was; }
      break;
    }
    case "dismissNotice":
      S.notices = S.notices.filter(n => n.id !== id); save();
      $("#banners").innerHTML = bannersInner(); break;
    case "dismissBanner":
      S.banners = S.banners.filter(b => b !== id); save();
      $("#banners").innerHTML = bannersInner(); break;

    /* Goals */
    case "newGoal": goalSheet(null); break;
    case "goal": goalSheet(id); break;
    case "toggleAllGoals": UI.allGoals = !UI.allGoals; rerenderGoals(); break;
    case "toggleAchieved": UI.showAchieved = !UI.showAchieved; rerenderGoals(); break;
    case "saveGoal": {
      const n = $("#gName"), name = n.value.trim();
      if (!name) { n.classList.add("bad"); setTimeout(() => n.classList.remove("bad"), 400); n.focus(); return; }
      const date = $("#gDate").value || "", note = $("#gNote").value.trim();
      if (id) Object.assign(S.goals.find(x => x.id === id), {name, date, note});
      else S.goals.push({id: uid(), name, date, note, created: new Date().toISOString(), achievedAt: null});
      closeSheet(); render(true); toast(id ? "Goal saved" : "Goal added"); break;
    }
    case "achieveGoal": {
      const g = S.goals.find(x => x.id === id); g.achievedAt = dkey();
      evalRewards(); closeSheet(); render(true); toast("Goal achieved"); break;
    }
    case "unachieveGoal": {
      const g = S.goals.find(x => x.id === id); g.achievedAt = null;
      evalRewards(); closeSheet(); render(true); toast("Moved back to active"); break;
    }
    case "deleteGoal":
      S.goals = S.goals.filter(x => x.id !== id);
      evalRewards(); closeSheet(); render(true); toast("Goal deleted"); break;

    /* Rewards */
    case "newReward": rewardSheet(null); break;
    case "reward": rewardSheet(id); break;
    case "saveReward": {
      const err = $("#rErr"), name = $("#rName").value.trim(), dIn = $("#rDays"), days = parseInt(dIn.value, 10);
      const r = id ? S.rewards.find(x => x.id === id) : null;
      if (!r && !name) { err.textContent = "Type what you'll get."; return; }
      if (!(r && r.earnedAt) && !(days >= 1 && days <= 999)) { err.textContent = "Enter a streak between 1 and 999 days."; return; }
      if (r && r.earnedAt && !name) { err.textContent = "An earned reward needs a name."; return; }
      if (r) { r.name = name; if (!r.earnedAt) r.days = days; }
      else S.rewards.push({id: uid(), days, name, earnedAt: null});
      evalRewards(); closeSheet(); render(true); toast(r ? "Saved" : "Milestone added"); break;
    }
    case "deleteReward":
      S.rewards = S.rewards.filter(x => x.id !== id); S.banners = S.banners.filter(b => b !== id);
      closeSheet(); render(true); toast("Deleted"); break;

    /* Profile */
    case "ringTap": Dawn.toPhase(id); return;
    case "gather": Dawn.toChecklist(); return;
    case "toDawn": window.scrollTo({top: 0, behavior: Dawn.reduce ? "auto" : "smooth"}); return;
    case "openProfile": UI.tab = "profile"; window.scrollTo(0, 0); render(); break;
    case "editProfile": profileSheet(); break;
    case "setFoot":
      UI.foot = UI.foot === el.dataset.v ? "" : el.dataset.v;
      el.parentElement.querySelectorAll(".opt").forEach(b => b.classList.toggle("on", b.dataset.v === UI.foot));
      break;
    case "saveProfile": {
      const n = $("#pName"), name = n.value.trim();
      if (!name) { n.classList.add("bad"); setTimeout(() => n.classList.remove("bad"), 400); n.focus(); return; }
      S.profile = Object.assign(S.profile || {}, {name, position: $("#pPos").value.trim(), club: $("#pClub").value.trim(), nation: $("#pNation").value,
        number: $("#pNum").value.replace(/\D/g, "").slice(0, 3), foot: UI.foot, motto: $("#pMotto").value.trim()});
      closeSheet(); render(true); toast("Profile saved"); break;
    }
    case "removePhoto":
      if (S.profile) S.profile.photo = "";
      closeSheet(); render(true); toast("Photo removed"); break;
    case "pickPhoto":
      UI.photoTarget = el.dataset.t;
      if (UI.photoTarget === "crest") UI.pdraft = {name: $("#pName").value, position: $("#pPos").value, club: $("#pClub").value, nation: $("#pNation").value,
        number: $("#pNum").value, foot: UI.foot, motto: $("#pMotto").value};
      if (UI.photoTarget === "setup") { UI.setup.name = $("#sName").value; UI.setup.position = $("#sPos").value; }
      $("#photoIn").value = ""; $("#photoIn").click(); break;
    case "posChip":
      UI.setup.name = $("#sName").value; UI.setup.position = el.dataset.v; drawSetup(); break;
    case "finishSetup": {
      const n = $("#sName"), name = n.value.trim();
      if (!name) { $("#sErr").textContent = "Add your name to get started."; n.classList.add("bad"); setTimeout(() => n.classList.remove("bad"), 400); return; }
      S.profile = Object.assign(S.profile || {}, {name, position: $("#sPos").value.trim(), photo: UI.setup.photo || ""});
      maybeSetup(); render(true); toast("Welcome, " + name.split(" ")[0]); break;
    }

    /* Sleep score */
    case "saveSleep": {
      const raw = $("#slScore").value.trim(), v = Number(raw);
      if (raw === "" || !Number.isInteger(v) || v < 0 || v > 100) { $("#slErr").textContent = "Enter a whole number from 0 to 100."; return; }
      const r = todayRec(), wasHit = hitDay(r);
      r.sleepScore = v; if (!r.checked.includes(id)) r.checked.push(id);
      recompute(); evalRewards(); closeSheet(); render(true);
      toast(!wasHit && hitDay(r) ? "Streak day locked in" : "Sleep score saved"); break;
    }
    case "clearSleep": {
      const r = todayRec(); delete r.sleepScore; r.checked = r.checked.filter(x => x !== id);
      recompute(); closeSheet(); render(true); toast("Score cleared"); break;
    }

    /* Sessions */
    case "newRest": restSheet(); break;
    case "pickRest": {
      const k = el.dataset.v;
      if (S.restDays[k]) delete S.restDays[k]; else S.restDays[k] = true;
      el.classList.toggle("on", !!S.restDays[k]);
      recompute(); evalRewards(); save(); break;
    }
    case "saveRest": {
      const v = $("#restDate").value;
      if (v && v >= dkey()) S.restDays[v] = true;
      recompute(); evalRewards(); closeSheet(); render(true); toast("Rest day saved"); break;
    }
    case "delRest":
      delete S.restDays[el.dataset.v];
      recompute(); evalRewards(); render(true); toast("Rest day removed"); break;
    case "restToggle": {
      const t = listFor(el.dataset.phase).find(x => x.id === id);
      if (t) { t.rest = !t.rest; if (!t.rest) delete t.rest; }
      recompute(); render(true); break;
    }
    case "addRest": {
      UI.addRest = UI.addRest || {};
      const ph = el.dataset.phase; UI.addRest[ph] = !UI.addRest[ph];
      el.classList.toggle("on", UI.addRest[ph]); break;
    }
    case "restGoal":
      S.restGoal = Math.max(1, Math.min(99, S.restGoal + Number(el.dataset.dir)));
      recompute(); evalRewards(); render(true); break;
    case "newSess": sessSheet(null); break;
    case "openSess": openSess(id); return;
    case "closeSess": closeSess(); return;
    case "toggleEarlier": UI.showEarlier = !UI.showEarlier; render(true); return;
    case "seType":
      UI.seType = el.dataset.v;
      el.parentElement.querySelectorAll(".se-tbtn").forEach(b => b.classList.toggle("on", b === el)); return;
    case "saveSess": {
      const date = $("#seDate").value, err = $("#seErr");
      if (!date) { err.textContent = "Pick a date for this session."; return; }
      const x = id ? S.sessions.find(s => s.id === id) : null;
      const old = x ? x.goals : [];
      const goals = $("#seGoals").value.split(/\r?\n/).map(g => g.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, "").trim()).filter(Boolean).slice(0, 12)
        .map(text => { const prev = old.find(g => g.text === text); return prev || {id: uid(), text, done: false}; });
      const data = {type: UI.seType, title: $("#seTitle").value.trim(), date, time: $("#seTime").value || "", goals, plan: $("#sePlan").value.replace(/\s+$/, "")};
      if (x) Object.assign(x, data); else S.sessions.push(Object.assign({id: uid(), done: false, created: new Date().toISOString()}, data));
      closeSheet(); render(true); if (x && UI.openSess === x.id) drawSess(x.id);
      toast(x ? "Session saved" : "Session added"); break;
    }
    case "editSess": sessSheet(id); break;
    case "sessGoal": {
      const x = S.sessions.find(s => s.id === id), g = x && x.goals.find(q => q.id === el.dataset.g); if (!g) return;
      g.done = !g.done; save(); drawSess(id); if (UI.tab === "plan") render(true); return;
    }
    case "doneSess": {
      const x = S.sessions.find(s => s.id === id); if (!x) return;
      x.done = !x.done; save(); drawSess(id); render(true);
      toast(x.done ? "Session completed" : "Marked not completed"); return;
    }
    case "deleteSess":
      S.sessions = S.sessions.filter(s => s.id !== id);
      closeSess(); render(true); toast("Session deleted"); break;

    /* Player card */
    case "openPack": Pack.open(el.dataset.v, "new"); return;
    case "replayCard": Pack.open(el.dataset.v, "replay"); return;
    case "previewTier": Pack.open(el.dataset.v, "preview"); return;
    case "packTap": Pack.tap(); return;
    case "packSkip": Pack.skip(); return;
    case "packDone": {
      const id = Pack.id, mode = Pack.mode, use = el.dataset.v === "use"; Pack.close();
      if (mode === "new") {
        const r = cardRatings(); S.cards.opened[id] = dkey(); S.cards.seen = {}; r.list.forEach(x => { S.cards.seen[x.k] = x.v; });
        if (use || !S.cards.opened[S.cards.equipped]) S.cards.equipped = id;
        S.notices = S.notices.filter(n => !(n.kind === "card" && n.ed === id));
        UI.cardFlip = false; UI.dirty = true; save(); render(true); toast(use ? "Card added to your profile" : "Card saved to your collection");
      }
      return;
    }
    case "equipCard":
      S.cards.equipped = el.dataset.v; UI.cardFlip = false; UI.dirty = true; save(); render(true); toast("Card in use"); return;
    case "openBinder": UI.tab = "collection"; window.scrollTo(0, 0); render(); return;
    case "devPreviewOff": S.devPreview = false; save(); render(true); toast("Preview mode off"); return;

/* ---------- Lock-in sound: a soft net thump and two bell tones, made in code ---------- */
const Sound = {
  ctx: null,
  play(){
    if (S.soundOn === false) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const a = this.ctx || (this.ctx = new AC());
      if (a.state === "suspended") a.resume();
      const t = a.currentTime + 0.02, out = a.createGain(); out.gain.value = 0.9; out.connect(a.destination);
      const o = a.createOscillator(), g = a.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.18);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.3);
      const len = Math.floor(a.sampleRate * 0.35), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      const n = a.createBufferSource(), bp = a.createBiquadFilter(), ng = a.createGain();
      n.buffer = buf; bp.type = "bandpass"; bp.frequency.value = 2200; bp.Q.value = 0.7; ng.gain.value = 0.06;
      n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t + 0.01);
      [[1318.5, 0.11, 0.06], [1975.5, 0.07, 0.15]].forEach(([fq, vol, dl]) => {
        const o2 = a.createOscillator(), g2 = a.createGain();
        o2.type = "sine"; o2.frequency.value = fq;
        g2.gain.setValueAtTime(0.0001, t + dl); g2.gain.exponentialRampToValueAtTime(vol, t + dl + 0.012); g2.gain.exponentialRampToValueAtTime(0.0001, t + dl + 1.5);
        o2.connect(g2); g2.connect(out); o2.start(t + dl); o2.stop(t + dl + 1.6);
      });
    } catch (e) {}
  }
